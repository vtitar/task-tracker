services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql

  messenger_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      - db
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
    working_dir: /var/www/html
    environment:
      APP_ENV: dev
      DATABASE_URL: mysql://app:app@db:3306/app
      MESSENGER_TRANSPORT_DSN: doctrine://default
    command: php bin/console messenger:consume async --time-limit=3600 --memory-limit=128M -vv

volumes:
  db_data:
